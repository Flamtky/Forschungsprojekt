def sha256 = { File input ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int read
        while ((read = stream.read(buffer)) >= 0) {
            if (read > 0) digest.update(buffer, 0, read)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

tasks.register('downloadLastHourFfmpeg') {
    group = 'build setup'
    description = 'Downloads pinned local FFmpeg executables; the files remain ignored by Git.'

    def targets = lastHourFfmpegBinaries.collect { spec ->
        layout.projectDirectory.file(
            "local-tools/ffmpeg/${spec.platform}/${spec.executable}"
        )
    } + lastHourFfmpegBinaries.collect { spec ->
        layout.projectDirectory.file(
            "local-tools/ffmpeg/${spec.platform}/${spec.executable}.license.md"
        )
    }
    outputs.files(targets)

    doLast {
        lastHourFfmpegBinaries.each { spec ->
            File target = file("local-tools/ffmpeg/${spec.platform}/${spec.executable}")
            if (target.isFile() && sha256(target) == spec.executableSha256) {
                target.setExecutable(true, false)
            } else {
                target.parentFile.mkdirs()
                File archive = new File(target.parentFile, "${spec.executable}.download.gz")
                File temporary = new File(target.parentFile, "${spec.executable}.download")
                String url =
                    "https://github.com/eugeneware/ffmpeg-static/releases/download/" +
                    "${lastHourFfmpegVersion}/${spec.asset}"

                def connection = new URI(url).toURL().openConnection()
                connection.setRequestProperty('User-Agent', 'TheLastHour-Gradle')
                connection.inputStream.withCloseable { input ->
                    archive.withOutputStream { output -> input.transferTo(output) }
                }
                if (sha256(archive) != spec.archiveSha256) {
                    archive.delete()
                    throw new GradleException("Checksum mismatch for ${spec.asset}")
                }

                new java.util.zip.GZIPInputStream(new FileInputStream(archive)).withCloseable {
                    input -> temporary.withOutputStream { output -> input.transferTo(output) }
                }
                archive.delete()
                if (sha256(temporary) != spec.executableSha256) {
                    temporary.delete()
                    throw new GradleException("Executable checksum mismatch for ${spec.asset}")
                }
                java.nio.file.Files.move(
                    temporary.toPath(),
                    target.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING
                )
                target.setExecutable(true, false)
            }

            File licenseTarget =
                new File(target.parentFile, "${spec.executable}.license.md")
            def licenseConnection = new URI(lastHourFfmpegLicenseUrl).toURL().openConnection()
            licenseConnection.setRequestProperty('User-Agent', 'TheLastHour-Gradle')
            byte[] licenseBytes = licenseConnection.inputStream.withCloseable { it.readAllBytes() }
            def licenseDigest = java.security.MessageDigest.getInstance('SHA-256')
            String licenseHash =
                licenseDigest.digest(licenseBytes)
                    .collect { String.format('%02x', it & 0xff) }
                    .join()
            if (licenseHash != lastHourFfmpegLicenseSha256) {
                throw new GradleException('Checksum mismatch for the FFmpeg license')
            }
            String licenseText = new String(licenseBytes, java.nio.charset.StandardCharsets.UTF_8)
            licenseTarget.text =
                """- Quelle: ${lastHourFfmpegLicenseUrl}
- Author: FFmpeg developers and ffmpeg-static contributors
- License: GPL-3.0-or-later

<details>

${licenseText}
</details>
"""
        }
    }
}

tasks.register('verifyLastHourFfmpegIsNotTracked') {
    group = 'verification'
    description = 'Fails if a local FFmpeg binary was accidentally added to Git.'

    doLast {
        File repository = rootProject.projectDir.parentFile
        Process process = new ProcessBuilder(
            'git', '-C', repository.absolutePath, 'ls-files', '--',
            'Java/game/local-tools/ffmpeg'
        ).redirectErrorStream(true).start()
        String output = process.inputStream.getText('UTF-8').trim()
        if (process.waitFor() != 0) {
            throw new GradleException("Could not verify local FFmpeg Git state: ${output}")
        }
        if (!output.isEmpty()) {
            throw new GradleException("Local FFmpeg files must not be tracked by Git: ${output}")
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { }
            }
        }
    }
}

