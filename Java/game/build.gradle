/*
    this task creates the jar files based on compiled classes from .java files and assets( comes from java-library plugin)
    manifest attribute is set to the main class of the project.
    It provides the main class information to jpackage for creating the native executable
*/
tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('buildDemoRoom', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('EscaperoomDemo')
    archiveFileName.set('EscapeRoomDemo.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'rooms.mushroom.MushRoom'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('buildTheLastHourJar', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('TheLastHour')
    archiveFileName.set('TheLastHour.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'rooms.lasthour.starter.TheLastHour'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('buildTheLastHourServerJar', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('TheLastHourServer')
    archiveFileName.set('TheLastHourServer.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(resources.text.fromString('server')) {
        rename { 'application.properties' }
    }

    manifest {
        attributes 'Main-Class': 'rooms.lasthour.starter.TheLastHour'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('buildTheLastHourPortableBundle', Zip) {
    group = 'build'
    description = 'Builds one local client package with FFmpeg for every supported platform.'
    dependsOn tasks.named('buildTheLastHourJar')
    dependsOn tasks.named('downloadLastHourFfmpeg')
    dependsOn tasks.named('verifyLastHourFfmpegIsNotTracked')

    archiveBaseName.set('TheLastHour')
    archiveClassifier.set('portable-with-ffmpeg')
    destinationDirectory.set(layout.buildDirectory.dir('distributions'))

    from(tasks.named('buildTheLastHourJar')) {
        into 'TheLastHour'
    }
    lastHourFfmpegBinaries.each { spec ->
        from("local-tools/ffmpeg/${spec.platform}/${spec.executable}") {
            into "TheLastHour/tools/ffmpeg/${spec.platform}"
            filePermissions {
                unix('rwxr-xr-x')
            }
        }
        from("local-tools/ffmpeg/${spec.platform}/${spec.executable}.license.md") {
            into "TheLastHour/tools/ffmpeg/${spec.platform}"
        }
    }
}

tasks.register('installTheLastHourDist', Sync) {
    group = 'build'
    dependsOn tasks.named('buildTheLastHourJar')

    into layout.buildDirectory.dir('installTheLastHour/theLastHour/lib')
    from tasks.named('buildTheLastHourJar')
    from configurations.runtimeClasspath
}

tasks.register('installTheLastHourServerDist', Sync) {
    group = 'build'
    dependsOn tasks.named('buildTheLastHourServerJar')

    into layout.buildDirectory.dir('installTheLastHourServer/theLastHourServer/lib')
